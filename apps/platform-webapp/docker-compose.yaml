name: dms-platform

services:
  postgres:
    image: postgres:18-alpine
    container_name: dms-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms_password
      POSTGRES_DB: dms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data

volumes:
  postgres_data:
